name: casegraph-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: casegraph
          POSTGRES_PASSWORD: casegraph_ci_only
          POSTGRES_DB: casegraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U casegraph"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://casegraph:casegraph_ci_only@127.0.0.1:5432/casegraph
      CASEGRAPH_ENV: test
      CASEGRAPH_AUTH_MODE: disabled
      CASEGRAPH_RATE_LIMIT_BACKEND: memory
      CASEGRAPH_UPLOAD_ALLOW_UNSCANNED_DEV: "true"
      CASEGRAPH_UPLOAD_SCANNER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-production.txt
          pip install pip-audit
      - name: PostgreSQL migration gate
        run: |
          alembic upgrade head
          test "$(python - <<'PY'
          from backend.db.migrations import expected_head_revision
          print(expected_head_revision())
          PY
          )" = "20261025_0009"
      - name: Static checks
        run: python -m ruff check backend evaluation validation submission scripts tests migrations
      - name: Regression suite
        run: ./scripts/verify.sh
      - name: Dependency audit
        run: pip-audit -r requirements-production.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install, typecheck and build
        working-directory: frontend
        run: |
          npm install
          npm run typecheck
          npm run build
          npm audit --audit-level=high
